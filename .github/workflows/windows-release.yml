name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Windows, X64, simplysign]
    timeout-minutes: 45
    env:
      REQUIRE_CODE_SIGNING: '1'
    steps:
      - name: Check out DeepSeek Work
        uses: actions/checkout@v7
        with:
          path: deepseek-work

      - name: Check out pinned DeepSeek Harness
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable; corepack prepare pnpm@11.7.0 --activate

      - name: Verify SimplySign Desktop session
        shell: pwsh
        run: |
          $desktop = Get-Process SimplySignDesktop -ErrorAction SilentlyContinue
          if (-not $desktop) {
            throw 'SimplySign Desktop must be running in the interactive self-hosted runner session.'
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $certificates = @(Get-ChildItem Cert:\CurrentUser\My | Where-Object {
            $_.HasPrivateKey -and
            $_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid -and
            $_.Subject -like '*RushRush Network Technology Ltd*' -and
            $_.NotAfter -gt (Get-Date)
          })
          if ($certificates.Count -ne 1) {
            throw "Expected exactly one active RushRush code-signing certificate from SimplySign; found $($certificates.Count)."
          }
          $signTool = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\signtool.exe'
          if (-not (Test-Path -LiteralPath $signTool)) {
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signTool -or -not (Test-Path -LiteralPath $signTool)) {
            throw 'Windows SDK SignTool is required on the self-hosted runner.'
          }
          "WIN_CSC_SHA1=$($certificates[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNTOOL_PATH=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install DeepSeek Harness dependencies
        shell: pwsh
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Install DeepSeek Work dependencies
        shell: pwsh
        working-directory: deepseek-work
        run: pnpm install --frozen-lockfile

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: deepseek-work
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - name: Check
        shell: pwsh
        working-directory: deepseek-work
        run: pnpm run check

      - name: Build, sign, and verify Windows release
        shell: pwsh
        working-directory: deepseek-work
        run: pnpm run release:win

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-work-windows-x64-${{ github.sha }}
          path: |
            deepseek-work/release/DeepSeek-Work-Setup-*-x64.exe
            deepseek-work/release/DeepSeek-Work-Setup-*-x64.exe.blockmap
            deepseek-work/build/runtime/runtime-pruning.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
