name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve deepseek-work. Do not include secrets or private data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps or example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant version, operating system, and runtime information.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or evidence
      description: Remove credentials, private paths, and sensitive data before posting.
      render: shell
